<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fair Turns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday family tool: playful, calm, readable from across the room
   IDEA a kitchen-counter turn timer: one big dial everyone can see
   PICTURE the dial, filled in the current kid's colour, with their drawn animal inside
   COLOUR white ground, sunflower stage field, navy ink, each kid's own colour on the dial
   TYPE Fredoka display + Nunito text
   LAYOUT laptop: stage left (60%), setup + queue right; phone: tabs, dial, controls, setup */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#12162b);--ink:light-dark(#1d2b53,#eef0ff);--mut:light-dark(#56618a,#aab1d4);--panel:light-dark(#f3f5fb,#1b2142);--line:light-dark(#dde2ef,#2f3663);--stage:light-dark(#ffd23f,#232a55);--sink:light-dark(#1d2b53,#fff1bf);--acc:#ff6b57;--track:light-dark(rgba(29,43,83,.13),rgba(255,255,255,.13))}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
h1,h2,.big{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;line-height:1.05;margin:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px max(4vw,16px);border-bottom:1px solid var(--line)}
h1{font-size:28px;display:flex;align-items:center;gap:10px}
h1 svg{width:38px;height:38px}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.alert{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:8px}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid currentColor;background:transparent;cursor:pointer;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage .btn.pri{background:var(--sink);color:var(--stage);border-color:var(--sink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
nav .btn{border-color:transparent}
nav .btn.on{background:var(--ink);color:var(--bg)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column}
.view{display:none;flex:1}
.view.on{display:grid}
.split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.stage{background:var(--stage);color:var(--sink);display:grid;place-items:center;align-content:center;gap:18px;padding:clamp(24px,4vw,48px) 16px;text-align:center}
.who{font-size:clamp(30px,4vw,44px)}
.dial{position:relative;width:min(400px,78vw,58vh);aspect-ratio:1}
.dial svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.arc{transition:stroke-dashoffset .25s linear}
.dial .in{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:2px}
.dial .av{width:40%}
.btn.big{min-height:58px;font-size:19px;padding:0 28px}
.btn svg{flex:none}
#pauseAll{background:var(--acc);border-color:var(--acc);color:#fff}
.pz{display:inline-block;background:var(--sink);color:var(--stage);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:800;margin-right:8px}
.dial.paused .time{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.dial.paused .time{animation:none}}
.time{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:clamp(40px,6.5vw,64px);font-variant-numeric:tabular-nums;line-height:1}
.of{font-weight:800;font-size:17px}
.ctrls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.side{padding:clamp(20px,3vw,36px) max(3vw,16px);display:grid;gap:18px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;align-content:start}
h2{font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:3px 14px 3px 3px;border-radius:999px;border:2px solid var(--line);background:var(--bg);min-height:44px;cursor:pointer;font-weight:800}
.chip svg{width:34px;height:34px}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--bg))}
.chip b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:13px}
label{font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=number],input[type=text],select{font-size:16px;min-height:44px;border:2px solid var(--line);border-radius:12px;padding:0 10px;background:var(--bg)}
input[type=number]{width:5.5em}
input[type=range]{width:170px;accent-color:var(--ink)}
input[type=file]{font-size:14px;max-width:100%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
.hint{font-size:14px;color:var(--mut);margin:0}
ol.q{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.q li{display:grid;grid-template-columns:auto 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 10px 4px 6px;border-radius:12px}
ol.q li.now{background:color-mix(in srgb,var(--c) 22%,transparent);font-weight:800}
ol.q li.done{opacity:.45}
ol.q .k{font-size:13px;color:var(--mut);width:1.6em;text-align:right}
ol.q svg{width:32px;height:32px}
ol.q .st{font-size:14px;white-space:nowrap}
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:clamp(20px,3vw,36px) max(4vw,16px);align-content:start}
.tcard{grid-template-columns:96px minmax(0,1fr);align-items:center}
.mini{position:relative;width:96px;aspect-ratio:1}
.mini svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.mini span{position:absolute;inset:0;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:600;font-size:21px;font-variant-numeric:tabular-nums}
.tcard h2{font-size:20px;margin-bottom:6px}
.up{color:var(--acc);font-weight:800}
.wtime{font-size:clamp(56px,9vw,104px);font-variant-numeric:tabular-nums}
.wtime small{font-size:.45em}
.racer{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.racer:last-child{border:0}
.racer svg{width:40px;height:40px}
.racer .res{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.place{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:14px;background:var(--c);color:#fff;font-size:14px;margin-right:6px}
.pcard{grid-template-columns:76px minmax(0,1fr);align-items:start}
.pcard>svg{width:76px;height:76px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c)}
.sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--panel)}
.anb{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--bg);cursor:pointer;padding:3px}
.anb.on{border-color:var(--ink)}
.anb svg{width:100%;height:100%}
.note{font-size:14px;color:var(--mut);padding:0 max(4vw,16px) 20px;margin:0}
ol.ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.ord li{display:grid;grid-template-columns:14px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px 6px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);cursor:grab;font-weight:800;user-select:none}
ol.ord li:hover{border-color:var(--c)}
ol.ord li.dragging{opacity:.35;cursor:grabbing}
ol.ord li.ot{box-shadow:0 -4px 0 var(--acc)}
ol.ord li.ob{box-shadow:0 4px 0 var(--acc)}
ol.ord svg{width:36px;height:36px}
.grip{width:14px;height:22px;background:radial-gradient(circle,var(--mut) 1.7px,transparent 2px) 0 0/7px 7.3px}
.pos{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;margin-right:8px}
.mv{display:flex;gap:4px}
.mv .btn{min-height:36px;width:36px;padding:0;border-width:1px}
.prof{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:20px;padding:clamp(20px,3vw,36px) max(4vw,16px);align-content:start}
.plist{display:grid;gap:10px;align-content:start}
.pitem{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;text-align:left;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--panel);cursor:pointer}
.pitem svg{width:64px;height:64px}
.pitem.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--panel))}
.pitem strong{display:block;font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:22px;line-height:1.1}
.pitem span{font-size:14px;color:var(--mut)}
.pnew{border-style:dashed}
.pitem .plus{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:2px dashed var(--mut);font-size:32px;color:var(--mut)!important}
.ed{gap:16px}
.ed .top{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
.ed .prev svg{width:150px;height:150px}
h3{font-size:17px;margin:0;font-weight:800}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.gt{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:14px}
.gt svg{width:64px;height:64px}
.gt:hover{border-color:var(--mut)}
.gt.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,var(--bg))}
.sh{display:grid;grid-template-columns:32px 4.5em minmax(0,1fr) auto;gap:10px;align-items:center}
.sh svg{width:32px;height:32px}
.sh .nm{font-weight:800}
.bar{height:12px;border-radius:6px;background:var(--track)}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c)}
.mins{font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px}
.seg .btn.on{background:var(--ink);color:var(--bg)}
.verdict{font-weight:800;margin:0}
.time.low{color:light-dark(#c62f1c,#ff8a7a)}
.set{grid-template-columns:minmax(0,1fr);padding:clamp(20px,3vw,36px) max(4vw,16px);align-content:start;max-width:1100px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px}
.vgrid>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
#micBtn.on{background:#2fbf71;border-color:#2fbf71;color:#fff}
#micBtn.awake{background:var(--acc);border-color:var(--acc);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){#micBtn.awake{animation:none}}
.heard{font-size:14px;color:var(--mut);max-width:26ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmds{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0}
.cmds dt{font-weight:800;white-space:nowrap}
.cmds dd{margin:0;color:var(--mut)}
.err{color:var(--acc);font-weight:800;font-size:14px;margin:0}
.ni{display:none}
@media(min-width:701px){nav{flex-wrap:nowrap}nav .btn{padding:0 14px}}
@media(max-width:1440px){#alertTxt{display:none}}
@media(max-width:1100px){#micTxt{display:none}.heard{display:none}}
@media(max-width:700px){
header{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
h1{font-size:22px}
h1 svg{width:30px;height:30px}
.alert{display:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:var(--bg);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
nav .btn{flex-direction:column;gap:2px;min-height:54px;padding:0 2px;font-size:12px;border-radius:12px}
nav .btn .ni{display:block;width:22px;height:22px}
nav .btn.on{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.note{display:none}
.stage{gap:12px;padding:20px 16px 24px}
.who{font-size:30px}
.dial{width:min(300px,74vw)}
.ctrls{width:100%;max-width:420px}
.ctrls .btn{flex:1}
.ctrls .btn.big{flex:1 1 100%}
.side,.grid,.prof,.set{padding:16px}
.tcard{grid-template-columns:80px minmax(0,1fr)}
.mini{width:80px}
.mini span{font-size:18px}
.wtime{font-size:64px}
}
@media(min-width:821px){.split>.stage{position:sticky;top:0;align-self:start;height:100vh;min-height:560px;overflow:hidden}.dial{width:min(400px,40vw,calc(100vh - 360px))}}
@media(max-width:820px){.split,.prof{grid-template-columns:minmax(0,1fr)}}
@media(max-width:480px){.ed .top{grid-template-columns:96px minmax(0,1fr)}.ed .prev svg{width:96px;height:96px}}
@media(prefers-reduced-motion:reduce){.arc{transition:none}}
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#ffd23f"/><path d="M50 50 L50 14 A36 36 0 1 1 18 66 Z" fill="#ff6b57"/><circle cx="50" cy="50" r="7" fill="#1d2b53"/></svg>Fair Turns</h1>
  <nav aria-label="Sections">
    <button class="btn on" data-act="tab" data-v="turns"><svg class="ni" viewBox="0 0 22 22" aria-hidden="true"><path d="M4.5 9.5a6.5 6.5 0 1 1 1.6 5.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 5.5v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Turns</button>
    <button class="btn" data-act="tab" data-v="timers"><svg class="ni" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 8v4l2.5 2M8.5 2.5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Timers</button>
    <button class="btn" data-act="tab" data-v="watch"><svg class="ni" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 20V3M5 4h11l-2.5 3.5L16 11H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Race</button>
    <button class="btn" data-act="tab" data-v="family"><svg class="ni" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 20a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Profiles</button>
    <button class="btn" data-act="tab" data-v="settings"><svg class="ni" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="6" r="2.4" fill="var(--bg)" stroke="currentColor" stroke-width="2"/><circle cx="14" cy="11" r="2.4" fill="var(--bg)" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="16" r="2.4" fill="var(--bg)" stroke="currentColor" stroke-width="2"/></svg>Settings</button>
  </nav>
  <button class="btn sm" id="micBtn" data-act="mic" aria-pressed="false" aria-label="Voice assistant"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="7" y="2" width="6" height="10" rx="3" fill="currentColor"/><path d="M4 9a6 6 0 0 0 12 0M10 15v3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span id="micTxt">Voice off</span></button>
  <span id="heard" class="heard" hidden></span>
  <button class="btn sm" id="pauseAll" data-act="pauseall" hidden><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1" fill="currentColor"/></svg>Pause everything</button>
  <div class="alert"><span id="alertTxt">Sounds on. Desktop alerts off.</span><button class="btn sm" data-act="alerts" id="alertBtn">Turn on alerts</button></div>
</header>
<main>
  <section class="view split on" id="v-turns"><div class="stage" id="tStage"></div><div class="side" id="tSide"></div></section>
  <section class="view grid" id="v-timers"></section>
  <section class="view split" id="v-watch"><div class="stage" id="wStage"></div><div class="side" id="wSide"></div></section>
  <section class="view prof" id="v-family"></section>
  <section class="view set" id="v-settings"></section>
</main>
<p class="note">Create profiles and pick characters under Profiles. Drag names in Turn order to change who goes first. Everything is saved in this browser. Keys: P pause or resume, N next turn, M add a minute, R say whose turn it is.</p>
<script>
{
const AN=['panda','turtle','bunny','bear','cat','capy','fox','frog','owl'];
const LBL={panda:'Panda',turtle:'Turtle',bunny:'Bunny',bear:'Bear',cat:'Cat',capy:'Capybara',fox:'Fox',frog:'Frog',owl:'Owl'};
const COL=['#b5835a','#ff6b57','#3fa7f5','#2fbf71','#9b6bff','#ffb400','#ff5fa2','#14b8a6'];
const SND={chime:[[784,0,.5],[1175,.18,.8]],bell:[[660,0,.9],[880,.25,.9],[990,.5,1.3]],pop:[[520,0,.15],[780,.12,.15],[1040,.24,.35]],horn:[[392,0,.3],[392,.38,.3],[523,.76,.8]],cheer:[[523,0,.2],[659,.15,.2],[784,.3,.2],[1047,.45,.9]]};
const DEF={people:[{id:'a',name:'Zoe',color:'#ff5fa2',animal:'panda',sound:'chime'},{id:'b',name:'Riley',color:'#3fa7f5',animal:'bear',sound:'horn'},{id:'c',name:'Myra',color:'#b5835a',animal:'capy',sound:'bell'},{id:'d',name:'Iris',color:'#14b8a6',animal:'owl',sound:'pop'}],
timers:[{id:'t1',name:'Reading',min:30,color:'#9b6bff'},{id:'t2',name:'Screen time',min:20,color:'#3fa7f5'},{id:'t3',name:'Piano practice',min:15,color:'#ff6b57'},{id:'t4',name:'Tidy up',min:10,color:'#2fbf71'}],
turns:{players:['a','b','c','d'],min:5,rounds:2,auto:false}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;
try{S=JSON.parse(localStorage.getItem('fairturns-v2')||'null')}catch(e){}
if(!S||!S.people)S=JSON.parse(JSON.stringify(DEF));
S.voice??={hand:{name:'',pitch:1.2,rate:1.05,style:'hype'},warn:{name:'',pitch:1.5,rate:1,style:'ocean'}};S.turns.speak??=true;S.turns.warn??=true;S.turns.rotate??=true;if(!Array.isArray(S.log))S.log=[];
S.people.forEach(p=>{if(p.name==='Zoe'&&p.animal==='bunny'&&p.color==='#ff5fa2')p.animal='panda';if(p.name==='Myra'&&p.animal==='cat'&&p.color==='#9b6bff'){p.animal='capy';p.color='#b5835a'}});
const save=()=>{try{localStorage.setItem('fairturns-v2',JSON.stringify(S));return true}catch(e){return false}};
const P=id=>S.people.find(p=>p.id===id)||{name:'?',color:'#999',animal:'bear',sound:'chime'};
const $=id=>document.getElementById(id);
let view='turns';

const K={ink:'#34323f',blush:'#ff9fb5',pink:'#ffc2d1',cream:'#fff8ef'};
function tint(hex,t){if(!/^#[0-9a-f]{6}$/i.test(hex))return hex;const n=parseInt(hex.slice(1),16),f=x=>Math.round(x+(255-x)*t);return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
const kShadow='<ellipse cx="50" cy="95" rx="30" ry="4" fill="#000" opacity=".12"/>';
const kWrap=x=>`<svg viewBox="0 0 100 100" aria-hidden="true">${kShadow}${x}</svg>`;
const kEyes=(y,l,r)=>[l,r].map(x=>`<circle cx="${x}" cy="${y}" r="4.6" fill="${K.ink}"/><circle cx="${x+1.6}" cy="${y-1.7}" r="1.7" fill="#fff"/><circle cx="${x-1.1}" cy="${y+2}" r=".8" fill="#fff"/>`).join('');

function ring(frac,color,sw,id,ticks){
  const r=50-sw/2-(ticks?4:0),C=2*Math.PI*r;let t='';
  if(ticks)for(let i=0;i<60;i++){const a=i/60*2*Math.PI,l=i%5?1.6:3.4;t+=`<line x1="${50+48*Math.cos(a)}" y1="${50+48*Math.sin(a)}" x2="${50+(48-l)*Math.cos(a)}" y2="${50+(48-l)*Math.sin(a)}" stroke="currentColor" stroke-width="${i%5?.5:.9}" opacity=".55"/>`;}
  return `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true">${t}<circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/><circle ${id?`id="${id}"`:''} class="arc" cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-frac)).toFixed(2)}" data-c="${C}"/></svg>`;
}
const setArc=(el,f)=>{if(el)el.setAttribute('stroke-dashoffset',(el.dataset.c*(1-Math.max(0,Math.min(1,f)))).toFixed(2))};
const fmt=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const fmtW=ms=>{const cs=Math.floor(ms/10),m=Math.floor(cs/6000),s=Math.floor(cs/100)%60;return `${m}:${String(s).padStart(2,'0')}<small>.${String(cs%100).padStart(2,'0')}</small>`};

let AC;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function play(n){const c=ac();if(!c)return;const t=c.currentTime+.02;(SND[n]||SND.chime).forEach(([f,d,l])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.4,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+l);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+l+.05)})}
function notify(msg){try{if(window.Notification&&Notification.permission==='granted')new Notification('Fair Turns',{body:msg,silent:true})}catch(e){}}
function alertState(){let on=false;try{on=window.Notification&&Notification.permission==='granted'}catch(e){}$('alertTxt').textContent=on?'Sounds and desktop alerts on.':'Sounds on. Desktop alerts off.';$('alertBtn').hidden=on}

/* ---------- Turns ---------- */
let T;
function resetTurns(){const q=[];for(let r=0;r<S.turns.rounds;r++)S.turns.players.forEach(id=>{if(S.people.some(p=>p.id===id))q.push(id)});const tot=S.turns.min*60000;T={q,i:0,total:tot,remain:tot,endAt:0,run:false,phase:'ready'}}
function newSession(){const o=S.turns.players;if(S.turns.rotate&&o.length>1&&S.turns.lastFirst===o[0]){o.push(o.shift());save()}resetTurns()}
newSession();
let VO=[];
function loadV(){try{VO=speechSynthesis.getVoices().slice().sort((x,y)=>(y.lang.startsWith('en')-x.lang.startsWith('en'))||x.name.localeCompare(y.name))}catch(e){VO=[]}
  if(VO.length&&!S.voice.picked){const f=ns=>(ns.map(n=>VO.find(v=>v.name===n)).find(Boolean)||{}).name||'';S.voice.hand.name=f(['Samantha','Karen','Google US English']);S.voice.warn.name=f(['Moira','Tessa','Karen','Google UK English Female']);S.voice.picked=true;save()}}
try{loadV();speechSynthesis.onvoiceschanged=()=>{const had=VO.length;loadV();if(!had&&view==='settings')renderSettings()}}catch(e){}
const HYPE=[n=>`${n}, you're up! Let's go!`,n=>`It's ${n}'s time to shine!`,n=>`Make some noise for ${n}!`];
const handPhrase=n=>S.voice.hand.style==='hype'?HYPE[Math.floor(Math.random()*HYPE.length)](n):`${n}, it's your turn!`;
const warn60=n=>S.voice.warn.style==='ocean'?`One minute left, ${n}! Swim fast, little fish!`:`One minute left, ${n}.`;
const warn10=()=>S.voice.warn.style==='ocean'?'Ten seconds! Splash!':'Ten seconds.';
function say(t,delay,k){if(!S.turns.speak)return;const c=S.voice[k||'hand'];setTimeout(()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),v=VO.find(x=>x.name===c.name);if(v){u.voice=v;u.lang=v.lang}u.rate=c.rate;u.pitch=c.pitch;speechSynthesis.speak(u)}catch(e){}},delay||0)}
function playClip(url){try{const a=new Audio(url);a.play().catch(()=>{})}catch(e){}}
function vBlock(k,title,styles){const c=S.voice[k];return `<div style="display:grid;gap:10px"><h3>${title}</h3><label>Voice <select id="v_${k}_name" style="max-width:100%">${['<option value="">Mac default</option>',...VO.map(v=>`<option value="${esc(v.name)}" ${v.name===c.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`)].join('')}</select></label><label>Pitch <input type="range" id="v_${k}_pitch" min="0.5" max="2" step="0.1" value="${c.pitch}"></label><label>Speed <input type="range" id="v_${k}_rate" min="0.6" max="1.6" step="0.1" value="${c.rate}"></label><label>Words <select id="v_${k}_style">${styles.map(([v,l])=>`<option value="${v}" ${v===c.style?'selected':''}>${l}</option>`).join('')}</select></label><div class="row"><button class="btn sm" data-act="vtest" data-k="${k}">Hear it</button></div></div>`}
function renderSettings(){$('v-settings').innerHTML=assistCard()+voiceCard()+moveCard()}
function moveCard(){return `<div class="card" style="margin-top:18px"><h2>Move your setup</h2><p class="hint" style="font-size:15px">Copies profiles, characters, clips, timers, voices and Fair share history, so another browser or the hosted version starts with everything.</p><div class="row"><button class="btn sm pri" data-act="exp">Copy my setup</button><span class="hint" id="expMsg"></span></div><label style="display:grid;gap:6px">Paste a copied setup here<textarea id="impTxt" rows="3" style="font:14px/1.4 Nunito,sans-serif;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);color:inherit;width:100%"></textarea></label><div class="row"><button class="btn sm" data-act="imp">Load setup</button><span class="err" id="impMsg" hidden></span></div></div>`}
function assistCard(){return `<div class="card" style="margin-bottom:18px"><h2>Voice assistant</h2><p class="hint" style="font-size:15px">Press the microphone button at the top, then say <strong>"Fair Turns"</strong> followed by a command. You can say it in one go ("Fair Turns, pause") or wait for the chime after "Fair Turns".</p>${SR?'':'<p class="err">This browser has no speech recognition. Use Google Chrome.</p>'}<p class="err" id="micErr" ${micErr?'':'hidden'}>${micErr}</p><dl class="cmds">${[['Pause','Pauses the turn'],['Resume / Start','Starts or resumes the turn'],['Next turn / Skip','Hands over to the next girl'],['Add a minute / Add 3 minutes','Adds time to the turn'],["Whose turn is it?",'Says whose turn it is and the time left'],["Who's next?",'Says who goes next'],['How much time is left?','Reads out the time'],['Restart','Starts the queue again'],['Make turns 10 minutes','Changes the turn length'],['Start the reading timer','Starts a saved timer by name'],['Go to sleep','Turns listening off']].map(([a,b])=>`<dt>"${a}"</dt><dd>${b}</dd>`).join('')}</dl></div>`}
function voiceCard(){return `<div class="card"><h2>Voices</h2><label><input type="checkbox" id="fSpeak" ${S.turns.speak?'checked':''}> Say whose turn it is out loud</label>${VO.length?'':'<p class="hint">Loading your Mac voices. Click the page once if this stays empty.</p>'}<div class="vgrid">${vBlock('hand','Turn hand-off',[['hype','Hype: "Riley, you\'re up! Let\'s go!"'],['plain','Plain: "Riley, it\'s your turn!"']])}${vBlock('warn','Warnings',[['ocean','Ocean: "Swim fast, little fish!"'],['plain','Plain: "One minute left."']])}</div><p class="hint">A girl's own clip, added in Profiles, plays instead of the hand-off voice.</p></div>`}
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function logTurn(id,ms){if(ms<1000)return;const n=Date.now();S.log.push({id,ms:Math.round(ms),t:n,d:dkey(new Date(n))});S.log=S.log.filter(x=>x.t>n-60*864e5);save()}
let shareRange='today';
const tLeft=()=>T.run?Math.max(0,T.endAt-Date.now()):T.remain;
function tStart(){if(T.phase==='done'||!T.q.length)return;ac();if(T.i===0&&T.phase==='ready'){S.turns.lastFirst=T.q[0];save()}T.endAt=Date.now()+T.remain;T.run=true;T.phase='run';renderTurns()}

function shareCard(){
  const st=new Date();st.setHours(0,0,0,0);if(shareRange==='week')st.setDate(st.getDate()-6);
  const L=S.log.filter(x=>x.t>=st.getTime());
  const rows=S.people.map(p=>{const m=L.filter(x=>x.id===p.id);return{p,ms:m.reduce((a,x)=>a+x.ms,0),n:m.length}}).sort((a,b)=>b.ms-a.ms);

    st.innerHTML=`<h2 class="who">${lab}</h2><div class="dial ${T.phase==='paused'?'paused':''}">${ring(l/T.total,p.color,9,'tArc',true)}<div class="in"><div class="av">${av(p.animal,p.color)}</div><div class="time" id="tTime">${fmt(l)}</div></div></div><div class="of">${T.phase==='paused'?'<span class="pz">Paused</span>':''}Turn ${T.i+1} of ${T.q.length}</div><div class="ctrls">${go}<button class="btn" data-act="tplus">+1 min</button><button class="btn" data-act="tnext">Skip turn</button><button class="btn" data-act="treset">Restart</button></div>`;
  }

/* ---------- Voice assistant ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,awakeUntil=0,micErr='',lastSpoke=0;
const NUM={one:1,a:1,an:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,fifteen:15,twenty:20,thirty:30};
const toN=w=>NUM[w]||parseInt(w,10)||0;
const WAKE=/\b(?:hey |ok |okay )?(?:fair|fare|fairs|fair's|there|far)[ -]?(?:turns?|terms?|tones?|tunes?)\b/i;
function reply(t){lastSpoke=Date.now();const was=S.turns.speak;S.turns.speak=true;say(t,0,'hand');S.turns.speak=was}
function micUI(){const b=$('micBtn');if(!b)return;const aw=listening&&Date.now()<awakeUntil;b.classList.toggle('on',listening&&!aw);b.classList.toggle('awake',aw);b.setAttribute('aria-pressed',listening);$('micTxt').textContent=!listening?'Voice off':aw?'Yes?':'Say "Fair Turns"'}
function heard(t){const h=$('heard');h.hidden=!t;h.textContent=t?`"${t}"`:''}
function curName(){return T.q.length&&T.phase!=='done'?P(T.q[T.i]).name:''}
function minsLeft(){const m=Math.ceil(tLeft()/60000);return `${m} minute${m===1?'':'s'}`}
function command(raw){
  const t=raw.toLowerCase().replace(/[.,!?']/g,'').trim();
  if(!t){awakeUntil=Date.now()+6000;play('pop');micUI();return}
  awakeUntil=0;micUI();
  let m;
  const active=T.q.length&&T.phase!=='done';
  if(/\b(go to sleep|stop listening|goodbye|bye)\b/.test(t)){reply('Okay, bye!');setTimeout(()=>micToggle(false),300);return}
  if(/\b(thank|thanks)\b/.test(t)){reply("You're welcome!");return}
  if(m=t.match(/\bstart (?:the )?(.+?) timer\b/)){const tm=S.timers.find(x=>m[1].includes(x.name.toLowerCase())||x.name.toLowerCase().includes(m[1]));if(tm){const r=rt(tm);r.up=false;if(!r.remain)r.remain=r.total;r.endAt=Date.now()+r.remain;r.run=true;if(view==='timers')renderTimers();reply(`Starting the ${tm.name} timer.`)}else reply("I couldn't find that timer.");return}
  if(m=t.match(/\b(?:make|set|change) (?:the )?turns? (?:to )?(\w+) minutes?/)){const n=toN(m[1]);if(n>0&&n<=180){S.turns.min=n;save();resetTurns();render();reply(`Turns are now ${n} minute${n===1?'':'s'}.`)}else reply("Sorry, how many minutes?");return}
  if(m=t.match(/\badd (\w+)? ?(?:more )?minutes?\b/)){if(!active)return reply('There is no turn running.');const n=Math.min(30,toN(m[1]||'one')||1);if(T.run)T.endAt+=n*60000;else T.remain+=n*60000;T.total=Math.max(T.total,tLeft());T.w60=T.w10=false;renderTurns();reply(`Added ${n} minute${n===1?'':'s'} for ${curName()}.`);return}
  if(/\b(whose|who s|who is|whos) (turn|go)\b/.test(t)){if(!active)return reply('All turns are done.');return reply(T.phase==='handoff'?`It's ${curName()}'s turn next. Ready when she is.`:`It's ${curName()}'s turn. ${minsLeft()} left.`)}
  if(/\b(who s|who is|whos) next\b/.test(t)){const n=T.q[T.i+1];return reply(n?`${P(n).name} is next.`:`${curName()} is the last turn.`)}
  if(/\b(how much|how long|time left|how many minutes)\b/.test(t)){if(!active)return reply('All turns are done.');return reply(`${minsLeft()} left for ${curName()}.`)}
  if(/\b(next|skip|done|finished|switch)\b/.test(t)){if(!active)return reply('All turns are done.');tNext();return}
  if(/\b(pause|stop|hold|wait|freeze)\b/.test(t)){if(T.run){tPause();reply(`Paused. ${minsLeft()} left for ${curName()}.`)}else reply("It's already paused.");return}
  if(/\b(resume|continue|start|go|play|unpause)\b/.test(t)){if(T.phase==='done'){newSession();renderTurns()}if(!T.run&&T.q.length){tStart();reply(`Go, ${curName()}!`)}else reply("It's already running.");return}
  if(/\b(restart|reset|start over)\b/.test(t)){resetTurns();renderTurns();reply(`Starting over. ${curName()} goes first.`);return}
  reply("Sorry, I didn't catch that.");
}
function onSpeech(txt,final){
  if(Date.now()-lastSpoke<1500||(window.speechSynthesis&&speechSynthesis.speaking))return;
  heard(txt);
  if(!final)return;
  const w=txt.match(WAKE);
  if(w){command(txt.slice(w.index+w[0].length));return}
  if(Date.now()<awakeUntil)command(txt);
}
function micToggle(on){
  if(!SR){micErr='Voice commands need Google Chrome.';if(view==='settings')renderSettings();return}
  listening=on;awakeUntil=0;try{S.voice.listen=on;save()}catch(e){}
  if(on){if(!rec){rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';
      rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];onSpeech(r[0].transcript.trim(),r.isFinal)}};
      rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){micErr='The microphone is blocked here. Open the hosted version of Fair Turns in Chrome and allow the microphone.';listening=false;micUI();if(view==='settings')renderSettings()}};
      rec.onend=()=>{if(listening)setTimeout(()=>{try{rec.start()}catch(e){}},250)}}
    micErr='';try{rec.start()}catch(e){}}
  else{try{rec&&rec.stop()}catch(e){};heard('')}
  micUI();
}
function render(){({turns:renderTurns,timers:renderTimers,watch:renderWatch,family:renderFamily,settings:renderSettings})[view]()}

/* ---------- Events ---------- */

  ac();

  if(a==='exp'){const txt=JSON.stringify({fairTurns:1,S});const m=$('expMsg');try{navigator.clipboard.writeText(txt).then(()=>{m.textContent='Copied. Paste it into Settings on the other version.'},()=>{$('impTxt').value=txt;m.textContent='Select the text in the box below and copy it.'})}catch(err){$('impTxt').value=txt;m.textContent='Select the text in the box below and copy it.'}return}
  if(a==='imp'){const m=$('impMsg');try{const d=JSON.parse($('impTxt').value.trim());if(!d.fairTurns||!d.S||!Array.isArray(d.S.people))throw 0;S=d.S;save();D=null;newSession();m.hidden=true;$('impTxt').value='';reply('Setup loaded.');renderSettings()}catch(err){m.textContent="That doesn't look like a Fair Turns setup.";m.hidden=false}return}

  if(a==='shuffle'){const o=S.turns.players;for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}save();resetTurns();renderTurns()}
  const tm=S.timers.find(t=>t.id===id);
  if(a==='tmstart'&&tm){const r=rt(tm);r.endAt=Date.now()+r.remain;r.run=true;renderTimers()}
  if(a==='tmpause'&&tm){const r=rt(tm);r.remain=rLeft(r);r.run=false;renderTimers()}
  if(a==='tmreset'&&tm){delete R[id];renderTimers()}
  if(a==='tmdel'){S.timers=S.timers.filter(t=>t.id!==id);delete R[id];save();renderTimers()}
  if(a==='ntcol'){ntCol=b.dataset.c;b.parentNode.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b))}
  if(a==='wstart'){W.t0=Date.now();W.run=true;renderWatch()}
  if(a==='wpause'){W.acc=wEl();W.run=false;renderWatch()}

  if(a==='wfin'){W.fin[id]=wEl();play(P(id).sound);if(W.racers.every(r=>W.fin[r]!=null)){W.acc=wEl();W.run=false}renderWatch()}
  if(a==='wpick'){const n=W.racers.indexOf(id);n>-1?W.racers.splice(n,1):W.racers.push(id);delete W.fin[id];renderWatch()}
  if(a==='mv'){const o=S.turns.players,k=o.indexOf(id),j=k+(+b.dataset.d);if(k>-1&&j>=0&&j<o.length){[o[k],o[j]]=[o[j],o[k]];save();resetTurns();renderTurns()}}

  if(a==='dsave'){const n=$('dName').value.trim();if(!n){$('dErr').hidden=false;$('dName').focus();return}D.name=n;D.sound=$('dSnd').value;if(!D.clip){D.clip=undefined;D.clipName=undefined}if(D.id){Object.assign(S.people.find(x=>x.id===D.id),D)}else{D.id=uid();S.people.push({...D});S.turns.players.push(D.id);W.racers.push(D.id)}if(!save()){const q=S.people.find(x=>x.id===D.id);if(q){delete q.clip;delete q.clipName}delete D.clip;save();renderFamily();const er=$('dClipErr');er.textContent='That clip is too big to save. Try a shorter one.';er.hidden=false;return}save();resetTurns();renderFamily();$('dTitle').textContent=`${n}'s profile is saved`}
  if(a==='pdel'){if(!b.dataset.arm){b.dataset.arm='1';b.textContent='Tap again to delete';return}S.people=S.people.filter(x=>x.id!==id);S.turns.players=S.turns.players.filter(x=>x!==id);W.racers=W.racers.filter(x=>x!==id);D=null;save();resetTurns();renderFamily()}
});

const clearDrag=()=>document.querySelectorAll('#ord li').forEach(x=>x.classList.remove('ot','ob','dragging'));
document.addEventListener('dragstart',e=>{const li=overLi(e);if(!li)return;dragId=li.dataset.id;li.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}});
document.addEventListener('dragover',e=>{const li=overLi(e);if(!li||!dragId)return;e.preventDefault();const r=li.getBoundingClientRect(),top=e.clientY<r.top+r.height/2;document.querySelectorAll('#ord li').forEach(x=>x.classList.remove('ot','ob'));if(li.dataset.id!==dragId)li.classList.add(top?'ot':'ob')});
document.addEventListener('drop',e=>{const li=overLi(e);if(!li||!dragId)return;e.preventDefault();const tid=li.dataset.id,d=dragId;dragId=null;clearDrag();if(tid===d)return;const r=li.getBoundingClientRect(),top=e.clientY<r.top+r.height/2,o=S.turns.players.filter(x=>x!==d);let k=o.indexOf(tid);if(!top)k++;o.splice(k,0,d);S.turns.players=o;save();resetTurns();renderTurns()});
document.addEventListener('dragend',()=>{dragId=null;clearDrag()});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addT')return;e.preventDefault();
  const n=$('ntName').value.trim();if(!n)return;
  S.timers.push({id:uid(),name:n,min:Math.max(1,Math.min(600,+$('ntMin').value||15)),color:ntCol});save();renderTimers();
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'&&view==='turns'&&e.target.tagName!=='BUTTON'){e.preventDefault();T.run?tPause():tStart();return}
  if(k==='p'){e.preventDefault();if(T.phase!=='done'&&T.q.length)T.run?tPause():tStart()}
  else if(k==='n'){e.preventDefault();if(T.phase!=='done'&&T.q.length)tNext()}
  else if(k==='m'){e.preventDefault();if(T.phase!=='done'&&T.q.length){T.w60=T.w10=false;if(T.run)T.endAt+=60000;else T.remain+=60000;T.total=Math.max(T.total,tLeft());renderTurns()}}
  else if(k==='r'){e.preventDefault();if(T.phase!=='done'&&T.q.length)say(`It's ${P(T.q[T.i]).name}'s turn. ${Math.ceil(tLeft()/60000)} minute${Math.ceil(tLeft()/60000)===1?'':'s'} left.`,0,'hand')}
});

/* ---------- Clock ---------- */
setInterval(()=>{
  if(T.run&&tLeft()<=0)tNext();
  if(T.run&&S.turns.warn){const l=tLeft(),nm=P(T.q[T.i]).name;if(!T.w60&&l<=60000&&l>55000&&T.total>65000){T.w60=true;play('pop');say(warn60(nm),400,'warn')}if(!T.w10&&l<=10000&&l>8000){T.w10=true;say(warn10(),0,'warn')}}
  if(view==='turns'&&T.q.length&&T.phase!=='done'){const l=tLeft(),x=$('tTime');if(x){x.textContent=fmt(l);x.classList.toggle('low',T.run&&l<=10000)}setArc($('tArc'),l/T.total)}
  let tick=false;
  S.timers.forEach(t=>{const r=R[t.id];if(r&&r.run&&rLeft(r)<=0){r.run=false;r.remain=0;r.up=true;play('bell');notify(`${t.name} is done`);tick=true}});
  if(view==='timers'){if(tick)renderTimers();else document.querySelectorAll('[data-tid]').forEach(c=>{const t=S.timers.find(x=>x.id===c.dataset.tid),r=t&&R[t.id];if(!r||!r.run)return;const l=rLeft(r);c.querySelector('.mini span').textContent=fmt(l);setArc(c.querySelector('.arc'),l/r.total)})}
  if(view==='watch'&&W.run){const x=$('wTime');if(x)x.innerHTML=fmtW(wEl())}
  if(listening&&awakeUntil&&Date.now()>awakeUntil){awakeUntil=0;micUI()}
  $('pauseAll').hidden=!(T.run||W.run||Object.values(R).some(r=>r.run));
  document.title=T.run?`${fmt(tLeft())} · ${P(T.q[T.i]).name}`:'Fair Turns';
},200);

try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
try{const d=window.claude?.hot?.data;if(d&&d.S&&d.S.people){S=d.S;resetTurns()}}catch(e){}
alertState();
render();
if(S.voice.listen&&SR&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.host))micToggle(true);
}
</script>
</body>
